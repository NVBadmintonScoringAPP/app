<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cyan512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="104" fill="url(#bg512)" />
  <rect x="6" y="6" width="500" height="500" rx="98" fill="none" stroke="#1e293b" stroke-width="6" />

  <!-- Badminton Court stylized grid -->
  <rect x="74" y="96" width="364" height="320" rx="28" fill="#0f172a" stroke="#334155" stroke-width="7" />
  <!-- Center Net Line -->
  <line x1="256" y1="96" x2="256" y2="416" stroke="#fbbf24" stroke-width="8" stroke-dasharray="10 8" />
  <!-- Service lines -->
  <line x1="148" y1="96" x2="148" y2="416" stroke="#475569" stroke-width="4" />
  <line x1="364" y1="96" x2="364" y2="416" stroke="#475569" stroke-width="4" />
  <!-- Center horizontal divider -->
  <line x1="74" y1="256" x2="438" y2="256" stroke="#334155" stroke-width="4" />

  <!-- Stylized Shuttlecock Icon in center -->
  <g transform="translate(256, 256) scale(2.6)">
    <!-- Cork head -->
    <circle cx="0" cy="14" r="9" fill="url(#gold512)" />
    <!-- Feathers -->
    <path d="M -16 -18 L -5 8 L 5 8 L 16 -18 Z" fill="#ffffff" opacity="0.95" />
    <path d="M -16 -18 Q 0 -14 16 -18" fill="none" stroke="#cbd5e1" stroke-width="2" />
    <line x1="-10" y1="-18" x2="-2" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="10" y1="-18" x2="2" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="0" y1="-16" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    <!-- Connecting threads -->
    <path d="M -12 -5 Q 0 -2 12 -5" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Digital Score Badge in top right corner -->
  <rect x="310" y="64" width="124" height="58" rx="16" fill="url(#cyan512)" />
  <text x="372" y="104" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">21</text>
</svg>
