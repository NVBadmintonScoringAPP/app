<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="192" height="192" rx="40" fill="url(#bg)" />
  <rect x="3" y="3" width="186" height="186" rx="37" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Badminton Court stylized grid -->
  <rect x="28" y="36" width="136" height="120" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2.5" />
  <!-- Center Net Line -->
  <line x1="96" y1="36" x2="96" y2="156" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4 3" />
  <!-- Service lines -->
  <line x1="56" y1="36" x2="56" y2="156" stroke="#475569" stroke-width="1.5" />
  <line x1="136" y1="36" x2="136" y2="156" stroke="#475569" stroke-width="1.5" />
  <!-- Center horizontal divider -->
  <line x1="28" y1="96" x2="164" y2="96" stroke="#334155" stroke-width="1.5" />

  <!-- Stylized Shuttlecock Icon in center -->
  <g transform="translate(96, 96)">
    <!-- Cork head -->
    <circle cx="0" cy="14" r="9" fill="url(#gold)" />
    <!-- Feathers -->
    <path d="M -16 -18 L -5 8 L 5 8 L 16 -18 Z" fill="#ffffff" opacity="0.95" />
    <path d="M -16 -18 Q 0 -14 16 -18" fill="none" stroke="#cbd5e1" stroke-width="2" />
    <line x1="-10" y1="-18" x2="-2" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="10" y1="-18" x2="2" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="0" y1="-16" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    <!-- Connecting threads -->
    <path d="M -12 -5 Q 0 -2 12 -5" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Digital 21 Badge in top right corner -->
  <rect x="116" y="24" width="46" height="22" rx="6" fill="#0284c7" />
  <text x="139" y="39" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">21</text>
</svg>
